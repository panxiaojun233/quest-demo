<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .score {
            color: #eee;
            font-size: 24px;
            font-weight: bold;
        }
        .canvas-wrapper {
            position: relative;
            border: 4px solid #16213e;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background-color: #0f0f23;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
        }
        .overlay.hidden {
            display: none;
        }
        .overlay h2 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #e94560;
        }
        .overlay p {
            font-size: 18px;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background-color: #e94560;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #ff6b6b;
        }
        button:active {
            transform: scale(0.95);
        }
        .controls {
            color: #888;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="score">SCORE: <span id="score">0</span></div>
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div id="startOverlay" class="overlay">
                <h2>Snake Game</h2>
                <p>Use arrow keys or WASD to move</p>
                <button id="startBtn">START GAME</button>
            </div>
            <div id="gameOverOverlay" class="overlay hidden">
                <h2>GAME OVER</h2>
                <p>Final Score: <span id="finalScore">0</span></p>
                <button id="restartBtn">PLAY AGAIN</button>
            </div>
        </div>
        <div class="controls">Arrow Keys / WASD to move</div>
    </div>

    <script>
        const GRID_SIZE = 20;
        const CELL_SIZE = 20;
        const INITIAL_SPEED = 150;
        const SPEED_INCREMENT = 5;
        const MIN_SPEED = 50;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('finalScore');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        let gameState = {
            snake: [],
            direction: 'RIGHT',
            nextDirection: 'RIGHT',
            food: { x: 0, y: 0 },
            score: 0,
            gameRunning: false,
            gameOver: false,
            speed: INITIAL_SPEED,
            intervalId: null
        };

        function initGame() {
            const startX = Math.floor(GRID_SIZE / 4);
            const startY = Math.floor(GRID_SIZE / 2);
            
            gameState.snake = [
                { x: startX, y: startY },
                { x: startX - 1, y: startY },
                { x: startX - 2, y: startY }
            ];
            gameState.direction = 'RIGHT';
            gameState.nextDirection = 'RIGHT';
            gameState.score = 0;
            gameState.gameRunning = false;
            gameState.gameOver = false;
            gameState.speed = INITIAL_SPEED;
            
            spawnFood();
            updateScore();
            render();
        }

        function spawnFood() {
            let newFood;
            let isOnSnake;
            
            do {
                newFood = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
                isOnSnake = gameState.snake.some(segment => 
                    segment.x === newFood.x && segment.y === newFood.y
                );
            } while (isOnSnake);
            
            gameState.food = newFood;
        }

        function moveSnake() {
            gameState.direction = gameState.nextDirection;
            
            const head = { ...gameState.snake[0] };
            
            switch (gameState.direction) {
                case 'UP':    head.y--; break;
                case 'DOWN':  head.y++; break;
                case 'LEFT':  head.x--; break;
                case 'RIGHT': head.x++; break;
            }
            
            if (checkWallCollision(head) || checkSelfCollision(head)) {
                endGame();
                return;
            }
            
            gameState.snake.unshift(head);
            
            if (head.x === gameState.food.x && head.y === gameState.food.y) {
                gameState.score += 10;
                updateScore();
                spawnFood();
                if (gameState.speed > MIN_SPEED) {
                    gameState.speed -= SPEED_INCREMENT;
                    restartGameLoop();
                }
            } else {
                gameState.snake.pop();
            }
        }

        function checkWallCollision(head) {
            return head.x < 0 || head.x >= GRID_SIZE || 
                   head.y < 0 || head.y >= GRID_SIZE;
        }

        function checkSelfCollision(head) {
            return gameState.snake.some(segment => 
                segment.x === head.x && segment.y === head.y
            );
        }

        function handleKeyDown(e) {
            if (!gameState.gameRunning) return;
            
            const keyMap = {
                'ArrowUp': 'UP', 'KeyW': 'UP',
                'ArrowDown': 'DOWN', 'KeyS': 'DOWN',
                'ArrowLeft': 'LEFT', 'KeyA': 'LEFT',
                'ArrowRight': 'RIGHT', 'KeyD': 'RIGHT'
            };
            
            const newDirection = keyMap[e.code];
            if (!newDirection) return;
            
            const opposites = {
                'UP': 'DOWN', 'DOWN': 'UP',
                'LEFT': 'RIGHT', 'RIGHT': 'LEFT'
            };
            
            if (opposites[newDirection] !== gameState.direction) {
                gameState.nextDirection = newDirection;
            }
            
            e.preventDefault();
        }

        function gameLoop() {
            moveSnake();
            if (gameState.gameRunning) {
                render();
            }
        }

        function startGame() {
            initGame();
            gameState.gameRunning = true;
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            gameState.intervalId = setInterval(gameLoop, gameState.speed);
        }

        function restartGameLoop() {
            if (gameState.intervalId) {
                clearInterval(gameState.intervalId);
            }
            gameState.intervalId = setInterval(gameLoop, gameState.speed);
        }

        function endGame() {
            gameState.gameRunning = false;
            gameState.gameOver = true;
            if (gameState.intervalId) {
                clearInterval(gameState.intervalId);
                gameState.intervalId = null;
            }
            finalScoreEl.textContent = gameState.score;
            gameOverOverlay.classList.remove('hidden');
        }

        function updateScore() {
            scoreEl.textContent = gameState.score;
        }

        function render() {
            ctx.fillStyle = '#0f0f23';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#1a1a2e';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }
            
            ctx.fillStyle = '#e94560';
            ctx.beginPath();
            ctx.arc(
                gameState.food.x * CELL_SIZE + CELL_SIZE / 2,
                gameState.food.y * CELL_SIZE + CELL_SIZE / 2,
                CELL_SIZE / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            
            gameState.snake.forEach((segment, index) => {
                if (index === 0) {
                    ctx.fillStyle = '#00d9ff';
                } else {
                    ctx.fillStyle = '#00ff88';
                }
                ctx.fillRect(
                    segment.x * CELL_SIZE + 1,
                    segment.y * CELL_SIZE + 1,
                    CELL_SIZE - 2,
                    CELL_SIZE - 2
                );
            });
        }

        document.addEventListener('keydown', handleKeyDown);
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        initGame();
    </script>
</body>
</html>
